---
layout: default
---
<div class="page-top">
    <a class="back" href="{{ '/blog/' | relative_url }}">
        {% include icon.html name="arrow-left" %}
        All posts
    </a>
</div>

<article class="article" aria-labelledby="post-title">
    <header class="page-head">
        <time class="article-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
        <h1 class="page-title" id="post-title">{{ page.title }}</h1>
        {% if page.description %}<p class="page-sub">{{ page.description }}</p>{% endif %}
    </header>
    <div class="article-body">
        {{ content }}
    </div>
</article>
