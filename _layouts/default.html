<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        {% seo %}
        <meta name="theme-color" content="#fdfbf7" />
        <script src="{{ '/assets/time-theme.js' | relative_url }}"></script>
        <link
            rel="icon"
            href="{{ '/favicon.svg' | relative_url }}"
            type="image/svg+xml"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap"
            rel="stylesheet"
        />
        <link
            rel="alternate"
            type="application/atom+xml"
            title="{{ site.title }}"
            href="{{ '/feed.xml' | relative_url }}"
        />
        <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
    </head>
    <body>
        <div class="sunlight" aria-hidden="true"><canvas></canvas></div>
        <main class="page{% if page.page_class %} {{ page.page_class }}{% endif %}">
            {{ content }}
        </main>
        <script src="{{ '/assets/sunlight.js' | relative_url }}" defer></script>
    </body>
</html>
